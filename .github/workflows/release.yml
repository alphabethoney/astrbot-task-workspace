name: Publish sanitized source release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release.yml'
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag (for example v1.1.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'v1.1.1' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Bootstrap publishing when the workflow and initial tag arrive together.
      # Future release tags still select their own immutable source directory.
      RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'v1.1.1' }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Validate version input
        run: |
          python3 - <<'PY'
          import os, re
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag):
              raise SystemExit('Expected a semantic release tag')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate and package exact tagged sources
        run: |
          set -euo pipefail
          package="releases/$RELEASE_TAG"
          test "$(cat "$package/VERSION")" = "${RELEASE_TAG#v}"
          python "$package/tools/privacy_check.py"
          python "$package/tools/package_release.py"
          cd "$package/dist"
          sha256sum -c "astrbot-dual-windows-${RELEASE_TAG#v}.tar.gz.sha256"
      - name: Create release with source archive and checksum
        run: |
          set -euo pipefail
          package="releases/$RELEASE_TAG"
          archive="$package/dist/astrbot-dual-windows-${RELEASE_TAG#v}.tar.gz"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite published assets.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$archive" "$archive.sha256" \
            --verify-tag --title "${RELEASE_TAG} — 脱敏源码与可移植安装器" \
            --notes-file "releases/notes/$RELEASE_TAG.md"
